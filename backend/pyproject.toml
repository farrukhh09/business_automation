[project]
name = "bakery-backend"
version = "1.0.0"
description = "Backend for the home bakery sales automation system (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Environment (APP_ENV=test, in-memory SQLite, ...) is configured in tests/conftest.py
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # SQLite stores Numeric as float; production runs on PostgreSQL with native NUMERIC.
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
    # Third-party deprecations on Python 3.14 (not actionable in this project).
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/celery_app.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "S"]
ignore = [
    "B008",   # FastAPI Depends()/Query() in argument defaults
    "S101",   # assert (tests)
    "RUF001", # Cyrillic text in strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
