# Alembic configuration.
# The database URL is NOT stored here: alembic/env.py uses Settings.DATABASE_URL
# (environment / .env). Override for one run with:  alembic -x db_url=sqlite:///./tmp.db upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# New revisions: alembic revision --autogenerate --rev-id 0002 -m "short description"
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# read by logging.config.fileConfig with raw=True: single % here (unlike the [alembic] section)
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
